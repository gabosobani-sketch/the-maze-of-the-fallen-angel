<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>The Maze of the Fallen Angel</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    canvas { background: #222; display: block; margin: 20px auto; border: 2px solid #555; }
  </style>
</head>
<body>
  <h1>The Maze of the Fallen Angel</h1>
  <p id="status">Conectando...</p>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let players = {};

    socket.on('connect', () => {
      statusText.innerText = 'Conectado como: ' + socket.id;
    });

    socket.on('currentPlayers', (serverPlayers) => {
      players = serverPlayers;
      draw();
    });

    socket.on('newPlayer', (playerInfo) => {
      players[playerInfo.id] = playerInfo;
      draw();
    });

    socket.on('playerMoved', (playerInfo) => {
      if (players[playerInfo.id]) {
        players[playerInfo.id].x = playerInfo.x;
        players[playerInfo.id].y = playerInfo.y;
        draw();
      }
    });

    socket.on('playerDisconnected', (id) => {
      delete players[id];
      draw();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const count = Object.keys(players).length;
      statusText.innerText = `Jugadores conectados: ${count}`;

      for (let id in players) {
        const p = players[id];
        ctx.fillStyle = id === socket.id ? '#00ff00' : '#ff0000';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  </script>
</body>
</html>
